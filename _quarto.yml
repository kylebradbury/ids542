project:
  type: website
  output-dir: docs
  resources:
    - "/notebooks/data/**"
    - "/shared/**"
  render:
    - "*.qmd"
    - "*.ipynb"
    - "!assignments/*"
    - "!archive/*"
    - "!lectures/*"
    - "!solutions/*"
    - "!dev/*"

website:
  title: "IDS 542: Applied Machine Learning (Spring 2027)"
  description: "Course website for IDS 542, Applied Machine Learning, at Duke University (Spring 2027): a fast-paced, applied introduction to machine learning for students in any discipline."
