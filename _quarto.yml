  image: img/decision-boundaries.png
  favicon: img/favicon.svg
  open-graph: true
  twitter-card: true
  google-analytics: "G-63SKKDGFHG"
  # Pages with `draft: true` in their front matter are left out of the
  # rendered site and search (they still show up in `quarto preview`)
  draft-mode: gone
